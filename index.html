          <animate attributeName="cy" values="98;124;98" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="100" y="190" fill="#7FB09A" font-family="Jost,sans-serif" font-size="11" font-style="italic" text-anchor="middle">hold 30 sec</text>`+E;
    case "ms10": // seated forward fold — legs out, slight knee bend, fold over
      return W+floor+label("Knees soft, belly toward thighs")+`
        <g stroke="#C9A24B" stroke-width="6" fill="none" stroke-linecap="round">
          <!-- legs out with slight bend -->
          <line x1="60" y1="160" x2="118" y2="152"/>
          <line x1="118" y1="152" x2="152" y2="164"/>
          <!-- torso folds down -->
          <line x1="60" y1="160" x2="60" y2="108">
            <animate attributeName="x2" values="62;100;62" dur="3.2s" repeatCount="indefinite"/>
            <animate attributeName="y2" values="106;140;106" dur="3.2s" repeatCount="indefinite"/>
          </line>
        </g>
        <circle cx="60" cy="98" r="10" fill="#C9A24B">
          <animate attributeName="cx" values="62;108;62" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="96;140;96" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="100" y="190" fill="#7FB09A" font-family="Jost,sans-serif" font-size="11" font-style="italic" text-anchor="middle">hold 30 sec</text>`+E;
    case "ms11": // puppy pose — hips high, chest sinks to floor
      return W+floor+label("Hips stay high, chest melts down")+`
        <g stroke="#C9A24B" stroke-width="6" fill="none" stroke-linecap="round">
          <!-- hips high above knees -->
          <line x1="140" y1="112" x2="140" y2="168"/>
          <!-- spine sloping down to hands -->
          <line x1="140" y1="112" x2="62" y2="146">
            <animate attributeName="y2" values="140;158;140" dur="3.2s" repeatCount="indefinite"/>
          </line>
          <!-- arms stretched forward on floor -->
          <line x1="62" y1="150" x2="40" y2="168"/>
        </g>
        <circle cx="54" cy="152" r="10" fill="#C9A24B">
          <animate attributeName="cy" values="146;162;146" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="100" y="190" fill="#7FB09A" font-family="Jost,sans-serif" font-size="11" font-style="italic" text-anchor="middle">hold 30 sec</text>`+E;
    case "ms12": // child's pose — folded, glutes to heels, forehead down
      return W+floor+label("Glutes to heels, forehead down, relax")+`
        <g stroke="#C9A24B" stroke-width="6" fill="none" stroke-linecap="round">
          <!-- folded body: hips back over heels -->
          <path d="M148 150 Q120 128 78 158" />
          <!-- shins on floor -->
          <line x1="148" y1="150" x2="148" y2="168"/>
          <!-- arms reaching forward on floor -->
          <line x1="80" y1="160" x2="40" y2="166"/>
        </g>
        <circle cx="70" cy="160" r="10" fill="#C9A24B"/>
        <text x="100" y="190" fill="#7FB09A" font-family="Jost,sans-serif" font-size="11" font-style="italic" text-anchor="middle">hold 30 sec · breathe</text>`+E;
    // ═══ FACE EXERCISES ═══
    case "e1": // chin tucks (head glides straight back)
      return W+label("Glide chin straight back")+faceHead(`<animateTransform attributeName="transform" type="translate" values="14 0;-6 0;14 0" dur="2.2s" repeatCount="indefinite"/>`)+`<g stroke="#D8B25E" stroke-width="3" fill="none"><line x1="150" y1="90" x2="128" y2="90"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></line><polyline points="136,84 126,90 136,96"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></polyline></g>`+E;
    case "e2": // neck curl-ups (head lifts off floor)
      return W+`<line x1="30" y1="150" x2="170" y2="150" stroke="#3A5474" stroke-width="3"/>`+label("Lie down, lift head like a crunch")+faceHead(`<animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="2.4s" repeatCount="indefinite"/>`,100,118)+E;
    case "e3": // jaw jut (lower jaw pushes forward)
      return W+label("Push lower jaw forward, hold")+faceHead('')+`<path d="M84 108 Q100 118 116 108" fill="none" stroke="#D8B25E" stroke-width="5"><animate attributeName="d" values="M84 108 Q100 118 116 108;M84 108 Q108 126 128 106;M84 108 Q100 118 116 108" dur="2.2s" repeatCount="indefinite"/></path>`+E;
    case "e4": // vowel O-E (mouth opens O then wide E)
      return W+label("Say big 'O' then wide 'E'")+faceHead('')+`<ellipse cx="100" cy="108" rx="12" ry="10" fill="none" stroke="#D8B25E" stroke-width="5"><animate attributeName="rx" values="10;22;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="ry" values="14;5;14" dur="1.8s" repeatCount="indefinite"/></ellipse>`+E;
    case "e6": // collarbone chin-in
      return W+label("Head level, glide back over shoulders")+faceHead(`<animateTransform attributeName="transform" type="translate" values="12 0;-6 0;12 0" dur="2.2s" repeatCount="indefinite"/>`)+E;
    // ═══ FACE MASSAGES (arrows sweep across face) ═══
    case "m1": return W+label("Sweep down sides of neck")+faceHead('')+sweep(100,120,60,158)+sweep(100,120,140,158)+E;
    case "m2": return W+label("From chin, glide out to ears")+faceHead('')+sweep(100,112,150,118)+sweep(100,112,50,118)+E;
    case "m3": return W+label("Push cheeks out toward ears")+faceHead('')+sweep(88,96,150,86)+sweep(112,96,50,86)+E;
    case "m4": return W+label("Under-eye: inner to outer, light")+faceHead('')+sweep(88,86,145,80)+sweep(112,86,55,80)+E;
    case "m5": return W+label("Forehead: center out to temples")+faceHead('')+sweep(100,60,150,58)+sweep(100,60,50,58)+E;
    default:
      return W+label("follow the steps below")+E;
  }
}
// a clear front-facing face for face-exercise/massage demos
function faceHead(extra,cx,cy){
  cx=cx||100; cy=cy||88;
  return `<g><g>${extra||''}
    <circle cx="${cx}" cy="${cy}" r="46" fill="none" stroke="#C9A24B" stroke-width="6"/>
    <circle cx="${cx-17}" cy="${cy-10}" r="4" fill="#C9A24B"/>
    <circle cx="${cx+17}" cy="${cy-10}" r="4" fill="#C9A24B"/>
    <path d="M${cx-15} ${cy+20} Q${cx} ${cy+30} ${cx+15} ${cy+20}" fill="none" stroke="#C9A24B" stroke-width="5"/>
  </g></g>`;
}
// a moving arrow showing massage/sweep direction
function sweep(x1,y1,x2,y2){
  return `<g>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#D8B25E" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <circle cx="${x1}" cy="${y1}" r="6" fill="#D8B25E" stroke="none">
      <animate attributeName="cx" values="${x1};${x2};${x1}" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="${y1};${y2};${y1}" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>`;
}

// ─── FOLLOW-ALONG MODE ───────────────────────────────────────────────────────
let faItems=[], faIdx=0, faTitle="", faTimer=null, faSecs=0, faRunning=false;

// pick a sensible duration (sec) for an item from its note text, else a default
function faDuration(item){
  const n=(item.note||"");
  // explicit "30 sec" / "45 sec"
  let m=n.match(/(\d+)\s*-?\s*(\d+)?\s*sec/i);
  if(m){ return m[2]?Math.round((Number(m[1])+Number(m[2]))/2):Number(m[1]); }
  // "hold 10s" style
  m=n.match(/hold\s*(\d+)\s*s/i);
  if(m) return +m[1]<=15?20:+m[1];
  // stretches → 30s hold; exercises with reps → ~40s; massages/face → 45s
  if(/each side|reps|sets/i.test(n)) return 40;
  return 30;
}
function openFollowAlong(items,title){
  faItems=items; faIdx=0; faTitle=title;
  drawFollowAlong();
}
function stopFaTimer(){ clearInterval(faTimer); faTimer=null; faRunning=false; }
function closeFollowAlong(){
  stopFaTimer();
  faItems=[]; document.getElementById("fa-modal-root").innerHTML="";
}
function faBeep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=660; g.gain.value=0.15;
    o.start(); o.stop(ctx.currentTime+0.18);
  }catch(e){}
}
function faMMSS(s){ const m=Math.floor(s/60), ss=s%60; return (m>0?m+":":"")+(m>0?String(ss).padStart(2,"0"):ss); }
function startFaTimer(){
  stopFaTimer();
  faRunning=true;
  faTimer=setInterval(()=>{
    faSecs--;
    if(faSecs<=0){
      stopFaTimer();
      faBeep();
      faSecs=0;
      updateFaTimerUI(true);
      return;
    }
    updateFaTimerUI(false);
  },1000);
  updateFaTimerUI(false);
}
function updateFaTimerUI(done){
  const t=document.getElementById("fa-timer");
  const b=document.getElementById("fa-timer-btn");
  if(t) t.textContent=done?"Time's up ✓":faMMSS(faSecs)+(faSecs<=1?" sec":" sec");
  if(t) t.style.color=done?"var(--green)":"var(--gold)";
  if(b) b.textContent=faRunning?"⏸ Pause":(faSecs>0?"▶ Start":"↺ Restart");
}
function drawFollowAlong(){
  stopFaTimer();
  const root=document.getElementById("fa-modal-root");
  if(!faItems.length){ root.innerHTML=""; return; }
  const item=faItems[faIdx];
  const pct=Math.round(((faIdx+1)/faItems.length)*100);
  faSecs=faDuration(item);
  root.innerHTML=`
    <div class="fa-modal">
      <div class="fa-head">
        <div class="fa-kicker">${esc(faTitle)}</div>
        <button class="fa-close" id="fa-close">×</button>
      </div>
      <div class="fa-count">${faIdx+1} of ${faItems.length}</div>
      <div class="fa-progressbar"><div style="width:${pct}%"></div></div>
      <div class="fa-stage">${animSVG(item.id)}</div>
      <div class="fa-name">${esc(item.name)}</div>
      <div class="fa-note">${esc(item.note)}</div>
      <div class="fa-timer" id="fa-timer">${faMMSS(faSecs)} sec</div>
      <button class="fa-start-btn" id="fa-timer-btn" style="margin-top:0;margin-bottom:12px">▶ Start</button>
      <div class="fa-controls">
        <button class="fa-nav" id="fa-prev" ${faIdx===0?"disabled":""}>‹ Prev</button>
        <button class="fa-nav primary" id="fa-next">${faIdx===faItems.length-1?"Done ✓":"Next ›"}</button>
      </div>
    </div>`;
  document.getElementById("fa-close").onclick=closeFollowAlong;
  document.getElementById("fa-prev").onclick=()=>{if(faIdx>0){faIdx--;drawFollowAlong();}};
  document.getElementById("fa-next").onclick=()=>{
    if(faIdx<faItems.length-1){faIdx++;drawFollowAlong();}
    else closeFollowAlong();
  };
  document.getElementById("fa-timer-btn").onclick=()=>{
    if(faRunning){ stopFaTimer(); updateFaTimerUI(false); }
    else {
      if(faSecs<=0) faSecs=faDuration(item); // restart
      startFaTimer();
    }
  };
}
