<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prodo</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="prodo-icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Prodo"/>
<meta name="theme-color" content="#0A1A2F"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#FAFAF8;
  --paper2:#FFFFFF;
  --sand:#FFFFFF;
  --sand2:#F4F4F2;
  --line:#E6E6E2;
  --line2:#D2D2CD;
  --ink:#0A0A0A;
  --ink2:#2A2A2A;
  --muted:#6E6E6A;
  --faint:#9B9B96;
  /* monochrome accent = near-black, luxury not neon */
  --forest:#111111;
  --forest2:#000000;
  --gold:#111111;
  --gold2:#000000;
  --gold-g:rgba(17,17,17,0.05);
  --burgundy:#8A8A85;
  --burgundy-g:rgba(138,138,133,0.08);
  --green:#1A1A1A;
  --green-g:rgba(26,26,26,0.05);
  --orange:#6E6E6A;
  --orange-g:rgba(110,110,106,0.06);
  --glow:0 0 0 1px rgba(0,0,0,0.04);
  --glow-soft:0 8px 30px rgba(0,0,0,0.06);
  --r:2px;--r2:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{
  background:#000000;
  color:var(--ink);
  font-family:'Jost',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
/* floating white sheet with soft gradient edges melting into black */
.app{
  max-width:460px;margin:0 auto;padding:30px 22px 110px;position:relative;z-index:2;
  min-height:100vh;
  background:#FAFAF8;
  border-radius:20px;
  -webkit-mask:
    radial-gradient(140% 120% at 50% 30%, #000 60%, transparent 100%);
  mask:
    radial-gradient(140% 120% at 50% 30%, #000 60%, transparent 100%);
}
/* soft outer glow so the sheet feels lifted off the black */
.sheet-glow{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 20%, rgba(255,255,255,0.05), transparent 60%)}

/* subtle luxury frame */
.hud-frame{display:none}
.hud-frame::before{display:none}
.hud-c{display:none}
.hud-ticks{display:none}
.scanline{display:none}
@keyframes scan{0%{top:8px}100%{top:calc(100% - 68px)}}

/* ── BOTTOM NAV (icons) ── */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;
  display:flex;gap:2px;padding:7px 9px;
  background:rgba(20,20,20,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.12);border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
.nav-btn{
  width:46px;height:40px;border:none;background:transparent;border-radius:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s;color:rgba(255,255,255,0.5);
}
.nav-btn svg{width:21px;height:21px;stroke-width:1.7;display:block}
.nav-btn.active{background:#FFFFFF;color:#000000}
.nav-btn:hover:not(.active){color:rgba(255,255,255,0.85)}

/* ── HEADER · JARVIS CONTROL PANEL ── */
.app-header{position:relative;margin-bottom:20px}
.app-header::after{display:none}

/* top status strip */
.sys-strip{display:flex;align-items:center;justify-content:space-between;
  font-family:'Jost',sans-serif;font-size:.56rem;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase;padding:0 2px 8px;border-bottom:1px solid var(--line)}
.sys-strip .sys-l,.sys-strip .sys-r{display:flex;align-items:center;gap:8px}
.sys-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sys-online{color:var(--green)}

/* main brand block: editorial header */
.hud-panel{position:relative;margin-top:14px;padding:20px 22px;
  background:var(--paper2);
  border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:var(--glow-soft);
  display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.hud-panel::before{display:none}
.hud-panel::after{display:none}
.brand-line{display:flex;flex-direction:column;gap:4px;align-items:flex-start;position:relative;z-index:1}
.brand-name{
  font-family:'Bodoni Moda',serif;font-size:2.1rem;font-weight:700;
  color:var(--ink);letter-spacing:.02em;text-transform:none;line-height:1;
}
.brand-sub{font-family:'Jost',sans-serif;font-size:.54rem;color:var(--muted);letter-spacing:.32em;text-transform:uppercase;font-weight:500}
.header-deco{display:none}
.header-date{display:flex;flex-direction:column;align-items:flex-end;gap:2px;position:relative;z-index:1}
.date-day{font-family:'Bodoni Moda',serif;font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:.02em;text-transform:uppercase}
.date-full{font-family:'Jost',sans-serif;font-size:.56rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.date-day::after{display:none}
.hud-clock{font-family:'Jost',sans-serif;font-size:.7rem;color:var(--faint);letter-spacing:.14em;margin-top:2px}

/* ── TABS · minimal editorial ── */
.tabs{display:flex;gap:0;flex-wrap:wrap;justify-content:stretch;margin:18px 0 26px;padding:0;border-bottom:1px solid var(--line)}
.tab{
  flex:1;min-width:56px;
  font-family:'Jost',sans-serif;font-size:.66rem;font-weight:500;
  padding:11px 6px;border:none;background:transparent;color:var(--muted);
  cursor:pointer;transition:all .2s;letter-spacing:.12em;text-transform:uppercase;position:relative;
  text-align:center;
}
.tab.active{color:var(--ink);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);display:block}
.tab:hover:not(.active){color:var(--ink2)}

/* ── COVER / HOME PAGE ── */
.cover{padding-top:6vh;display:flex;flex-direction:column;min-height:80vh}
.cover-logo{width:74px;height:74px;margin:0 auto 20px;display:block}
.cover-logo svg{width:100%;height:100%;display:block}
.cover-brand{font-family:'Bodoni Moda',serif;font-size:4.2rem;font-weight:700;color:var(--ink);letter-spacing:.01em;line-height:.9;text-align:center}

/* floating bubbles — subtle black orbs drifting across the whole UI */
.bubbles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#content,.app-header{position:relative;z-index:2}
.bottom-nav{z-index:60}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,0,0,0.06),rgba(0,0,0,0.02));animation:float-b linear infinite}
@keyframes float-b{
  0%{transform:translateY(20px) translateX(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-120px) translateX(24px);opacity:0}
}
/* tiny decorative dots inside the sheet for texture */
.cover-tagline{font-family:'Jost',sans-serif;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);text-align:center;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.cover-tagline::before,.cover-tagline::after{content:"";width:22px;height:1px;background:var(--line2)}
.cover-clock{font-family:'Jost',sans-serif;font-size:2.4rem;font-weight:300;color:var(--ink);letter-spacing:.14em;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
.cover-date{font-family:'Jost',sans-serif;font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.28em;text-transform:uppercase;text-align:center;margin-top:8px}
.cover-greeting{font-family:'Bodoni Moda',serif;font-style:italic;font-size:1.05rem;color:var(--ink2);text-align:center;margin-top:22px}
.cover-motive{font-family:'Jost',sans-serif;font-size:.82rem;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto}
.pose-draw{flex:0 0 100%;margin-top:10px;background:#F4F4F2;border:1px solid var(--line);border-radius:var(--r2);padding:4px}
.pose-svg{width:100%;height:130px;display:block}

/* swipeable widget carousel */
.widget-wrap{margin-top:auto;padding-top:34px}
.widget-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 2px 10px;scrollbar-width:none}
.widget-track::-webkit-scrollbar{display:none}
.widget-card{
  flex:0 0 100%;scroll-snap-align:center;
  background:var(--ink);color:#FAFAF8;border-radius:20px;padding:24px;
  min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
  position:relative;overflow:hidden;transition:transform .2s;
}
.widget-card:active{transform:scale(0.98)}
.widget-card.light{background:#FFFFFF;color:var(--ink);border:1px solid var(--line)}
.widget-top{display:flex;justify-content:space-between;align-items:flex-start}
.widget-label{font-family:'Jost',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.widget-big{font-family:'Bodoni Moda',serif;font-size:3rem;font-weight:600;line-height:1}
.widget-sub{font-family:'Jost',sans-serif;font-size:.86rem;opacity:.75;line-height:1.4}
.widget-arrow{width:26px;height:26px;border-radius:50%;border:1px solid currentColor;opacity:.4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.widget-dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.widget-dot{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:all .2s}
.widget-dot.active{background:var(--ink);width:18px;border-radius:3px}
.widget-mini{font-family:'Jost',sans-serif;font-size:.8rem;line-height:1.5;opacity:.85}
.widget-mini-row{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,0.12)}
.widget-card.light .widget-mini-row{border-color:var(--line)}

/* ── PANELS ── */
.card,.hero,.gym-hero,.nutr-hero,.money-hero,.money-section-card,.goal-set-form,.money-stat,.stat-card,.wish-form,.goal-row,.wish-card,.ex-card,.pr-card,.t-row,.b-row,.food-row,.weight-row,.weight-log-item,.money-entry,.attend-stat,.goal-edit-row,.w-cell,.j-prev{
  background:var(--sand);
  border:1px solid var(--line);
}
.card{border-radius:var(--r2);position:relative;overflow:hidden;margin-bottom:8px}
.card-body{padding:18px 20px}

/* ── HERO ── */
.hero{border-radius:var(--r2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);background:var(--paper2);box-shadow:var(--glow-soft)}
.hero::before{display:none}
.hero-pts{font-family:'Bodoni Moda',serif;font-size:3.8rem;font-weight:600;color:var(--ink);line-height:.85}
.hero-label{font-family:'Jost',sans-serif;font-size:.58rem;color:var(--muted);font-weight:500;letter-spacing:.24em;text-transform:uppercase;margin-top:6px}
.hero-right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;position:relative;z-index:1}
.streak{font-family:'Jost',sans-serif;font-size:.82rem;color:var(--ink);font-weight:600}
.goal-label{font-size:.85rem;color:var(--muted);font-style:italic}

/* ── PROGRESS BARS ── */
.bar-wrap{height:3px;background:var(--sand2);margin:18px 0 6px;position:relative;overflow:visible;border:none}
.bar-fill{height:100%;background:var(--gold);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.bar-fill::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;background:var(--gold);border-radius:50%;box-shadow:var(--glow)}
.bar-fill.green{background:var(--forest)}
.bar-fill.green::after{background:var(--forest)}
.bar-fill.over{background:var(--burgundy)}
.bar-pct{font-family:'Jost',sans-serif;font-style:italic;font-size:.72rem;color:var(--faint);margin-bottom:18px}
.encourage{font-family:'Jost',sans-serif;font-style:italic;font-size:.9rem;color:var(--muted);margin-bottom:22px}

/* ── PILLS ── */
.pills,.day-pills,.gym-day-pills,.wish-cat-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.pill,.day-pill,.gym-pill,.wish-cat-pill{
  font-family:'Bodoni Moda',serif;font-size:.72rem;font-weight:600;padding:5px 13px;
  border-radius:2px;border:1px solid var(--line2);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.06em;text-transform:uppercase;
}
.pill.active,.day-pill.active,.wish-cat-pill.active{border-color:var(--forest);background:var(--forest);color:var(--paper);box-shadow:var(--glow);font-weight:700}
.gym-pill.active{border-color:var(--forest);background:var(--forest);color:var(--paper);box-shadow:var(--glow);font-weight:700}
.day-pill.today-dot::after{content:" •";color:var(--gold)}

/* ── SECTION LABEL ── */
.stitle{
  font-family:'Bodoni Moda',serif;font-size:.82rem;font-weight:600;color:var(--forest);
  letter-spacing:.18em;text-transform:uppercase;margin:26px 0 12px;
  display:flex;align-items:center;gap:12px;
}
.stitle::before{content:"";width:5px;height:5px;background:var(--gold);border-radius:50%;flex-shrink:0}
.stitle::after{content:"";flex:1;height:1px;background:var(--line2)}

/* ── ROWS ── */
.t-row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:var(--r);margin-bottom:5px;transition:all .2s}
.t-row:hover{border-color:var(--line2);background:var(--sand2)}
.t-row:hover .del-btn{opacity:1}
.t-row.now{background:var(--gold-g);border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.t-time{width:96px;flex-shrink:0;font-family:'Jost',sans-serif;font-size:.72rem;font-weight:400;color:var(--faint);line-height:1.5;font-style:italic}
.t-row.now .t-time{color:var(--gold);font-style:normal}
.t-check{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--paper);transition:all .2s}
.t-check:hover{border-color:var(--forest)}
.t-check.done{background:var(--forest);border-color:var(--forest);box-shadow:var(--glow);color:var(--paper)}
.t-name{flex:1;font-size:.98rem;font-weight:400;color:var(--ink);letter-spacing:.01em}
.t-name.done{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.pts-chip{font-family:'Bodoni Moda',serif;font-size:.76rem;font-weight:600;color:var(--gold);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:1px 8px;flex-shrink:0}
.del-btn{opacity:0;background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;transition:all .15s;flex-shrink:0}
.del-btn:hover{color:var(--burgundy)}

.b-row{display:flex;align-items:center;gap:11px;padding:9px 15px;border-radius:var(--r);margin-bottom:5px}
.b-row:hover .del-btn{opacity:1}

/* ── EMPTY ── */
.empty-state,.empty-msg{font-family:'Jost',sans-serif;font-style:italic;font-size:.9rem;color:var(--faint);text-align:center;padding:22px;background:transparent;border:1px dashed var(--line2);border-radius:var(--r);line-height:1.6}

/* ── INPUTS ── */
input,select,textarea{
  font-family:'Jost',sans-serif;background:var(--paper);border:1px solid var(--line2);
  border-radius:var(--r);color:var(--ink);font-size:16px;font-weight:400;
  padding:9px 12px;transition:all .18s;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-g)}
input[type=number]{width:58px;text-align:center;font-family:'Jost',sans-serif;font-size:16px}
input[type=time]{width:88px;font-family:'Jost',sans-serif;font-size:16px}
select{color:var(--muted);cursor:pointer;font-size:16px}
::placeholder{color:var(--faint);font-style:italic}
.food-search{font-size:16px!important}

/* ── ADD FORMS ── */
.add-row,.food-add-row,.ex-add-row,.money-form{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.add-row input[type=text]{flex:1;min-width:100px}
.add-btn,.gym-add-btn,.food-add-btn,.money-add-btn{
  width:36px;height:36px;border-radius:var(--r);border:1px solid var(--forest);
  background:var(--forest);color:var(--paper);font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;line-height:1;
}
.add-btn:hover,.gym-add-btn:hover,.food-add-btn:hover,.money-add-btn:hover{background:var(--forest2)}

/* ── ACTION / TAB BUTTONS ── */
.action-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.action-btn,.gym-tab-btn,.nutr-tab-btn{
  font-family:'Bodoni Moda',serif;font-size:.78rem;font-weight:600;padding:6px 14px;
  border-radius:2px;border:1px solid var(--line2);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .18s;letter-spacing:.08em;text-transform:uppercase;
}
.action-btn:hover,.action-btn.on{border-color:var(--gold);background:var(--gold-g);color:var(--forest)}
.gym-tab-btn.active{border-color:var(--forest);background:var(--forest);color:var(--paper)}
.nutr-tab-btn.active{border-color:var(--forest);background:var(--forest);color:var(--paper)}
.gym-tab-btns,.nutr-tab-btns{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}

/* ── GOAL ROW ── */
.goal-row,.goal-edit-row{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 16px;margin-bottom:6px}
.goal-row label,.goal-edit-row label{flex:1;font-size:.9rem;color:var(--muted);font-style:italic}
.goal-row input,.goal-edit-row input{width:70px;background:var(--paper);border:1px solid var(--line2);color:var(--forest);font-family:'Bodoni Moda',serif;font-weight:600;font-size:1rem}

/* ── WEEK ── */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.w-cell{aspect-ratio:1;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.w-cell.today{border-color:var(--gold);background:var(--gold-g)}
.w-day{font-family:'Bodoni Moda',serif;font-size:.6rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.w-pct{font-family:'Bodoni Moda',serif;font-size:.92rem;font-weight:700;color:var(--forest)}
.stat-card{border-radius:var(--r);padding:12px 16px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-size:.92rem;font-weight:400;color:var(--muted)}
.stat-val{font-family:'Bodoni Moda',serif;font-weight:700;color:var(--forest);font-size:1rem}

/* ── NOTES ── */
.j-date{font-family:'Bodoni Moda',serif;font-size:.82rem;font-weight:600;color:var(--forest);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.j-date::before{content:"";width:5px;height:5px;background:var(--gold);border-radius:50%}
.j-date::after{content:"";flex:1;height:1px;background:var(--line2)}
textarea{width:100%;min-height:180px;resize:vertical;border-radius:var(--r2);line-height:1.8;font-size:16px;font-weight:400;color:var(--ink);padding:18px;background:var(--sand)}
.saved{font-family:'Jost',sans-serif;font-style:italic;font-size:.75rem;color:var(--forest);text-align:right;margin-top:6px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.j-prev{border-radius:var(--r);padding:13px 15px;margin-bottom:5px}
.j-prev-date{font-family:'Bodoni Moda',serif;font-size:.66rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
.j-prev-text{font-size:.9rem;color:var(--muted);font-weight:400;line-height:1.6}
.note-row{align-items:flex-start}
.note-date{font-family:'Jost',sans-serif;font-style:italic;font-size:.68rem;color:var(--faint);margin-top:3px}

/* ── POMODORO ── */
.pomo-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 16px}
.pomo-modes{display:flex;gap:6px;margin-bottom:28px}
.pomo-ring{width:200px;height:200px;border-radius:50%;border:1px solid var(--line2);background:var(--sand);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin-bottom:28px;box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line)}
.pomo-ring-arc{position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--gold);clip-path:polygon(50% 50%,50% 0%,50% 0%);transition:clip-path 1s linear}
.pomo-time{font-family:'Bodoni Moda',serif;font-size:3.4rem;font-weight:600;color:var(--forest);letter-spacing:.02em}
.pomo-lbl,.pomo-mode-label{font-family:'Bodoni Moda',serif;font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.pomo-btns{display:flex;gap:8px}
.pomo-btn{font-family:'Bodoni Moda',serif;font-size:.8rem;font-weight:600;padding:10px 26px;border-radius:2px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.1em;text-transform:uppercase}
.pomo-btn:hover{border-color:var(--forest);color:var(--forest)}
.pomo-btn.primary{border-color:var(--forest);background:var(--forest);color:var(--paper)}
.pomo-sessions{margin-top:22px;font-family:'Jost',sans-serif;font-style:italic;font-size:.88rem;color:var(--muted)}
.pomo-sessions b{color:var(--forest);font-style:normal;font-weight:600}

/* ── GYM ── */
.gym-hero{border-radius:var(--r2);padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.gym-hero::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);opacity:.5;border-radius:2px;pointer-events:none}
.gym-hero-title{font-family:'Bodoni Moda',serif;font-size:1.4rem;font-weight:600;color:var(--forest);letter-spacing:.04em;text-transform:uppercase;position:relative;z-index:1}
.gym-hero-sub{font-family:'Jost',sans-serif;font-style:italic;font-size:.82rem;color:var(--muted);margin-top:5px;position:relative;z-index:1}
.muscle-group{margin-bottom:18px}
.muscle-label{font-family:'Bodoni Moda',serif;font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.muscle-label::before{content:"";width:4px;height:4px;background:var(--gold);border-radius:50%}
.muscle-label::after{content:"";flex:1;height:1px;background:var(--line2)}
.ex-card{border-radius:var(--r);padding:13px 15px;margin-bottom:6px;transition:all .18s}
.ex-card:hover{border-color:var(--line2)}
.ex-card:hover .del-btn{opacity:1}
.ex-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ex-name{flex:1;font-size:.98rem;font-weight:500;color:var(--ink);letter-spacing:.01em}
.ex-done-badge{font-family:'Bodoni Moda',serif;font-size:.68rem;font-weight:600;color:var(--forest);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:1px 7px}
.sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.set-row{background:var(--paper);border-radius:2px;padding:6px 9px;display:flex;align-items:center;gap:4px;border:1px solid var(--line)}
.set-num{font-family:'Bodoni Moda',serif;font-size:.6rem;font-weight:600;color:var(--faint);flex-shrink:0;letter-spacing:.06em}
.set-input{font-family:'Jost',sans-serif;font-weight:600;font-size:.84rem;background:transparent;border:none;color:var(--forest);width:26px;text-align:center;padding:0}
.set-input:focus{outline:none;box-shadow:none}
.set-sep{color:var(--faint);font-size:.66rem;font-style:italic}
.set-done-btn{width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--paper);flex-shrink:0;transition:all .15s}
.set-done-btn:hover{border-color:var(--forest)}
.set-done-btn.done{background:var(--forest);border-color:var(--forest)}
.ex-add-row input[type=number]{width:48px}
.ex-add-row select{color:var(--muted);font-size:.84rem;padding:8px 10px}
.pr-card{border-radius:var(--r);padding:11px 15px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.pr-name{font-size:.94rem;font-weight:400;color:var(--ink)}
.pr-val{font-family:'Bodoni Moda',serif;font-size:.9rem;font-weight:600;color:var(--forest)}
.pr-date{font-family:'Jost',sans-serif;font-style:italic;font-size:.68rem;color:var(--faint);margin-top:2px}
.complete-btn{width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--forest);background:var(--forest);color:var(--paper);font-family:'Bodoni Moda',serif;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:14px;transition:all .2s;letter-spacing:.14em;text-transform:uppercase;box-shadow:var(--glow)}
.complete-btn:hover{background:var(--forest2);box-shadow:0 0 18px rgba(0,0,0,0.16)}
.complete-btn:hover{background:var(--forest2)}
.ex-big-check{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper);flex-shrink:0;transition:all .2s}
.ex-big-check:hover{border-color:var(--forest)}
.ex-big-check.done{background:var(--forest);border-color:var(--forest)}
.attend-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.attend-cell{aspect-ratio:1;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'Jost',sans-serif;font-size:.62rem;font-weight:500}
.attend-cell.went{background:var(--forest);color:var(--paper)}
.attend-cell.missed{background:var(--sand);color:var(--faint);border:1px solid var(--line)}
.attend-cell.future{background:transparent;opacity:.3}
.attend-cell.is-today{box-shadow:0 0 0 1px var(--gold) inset}
.attend-stats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.attend-stat{border-radius:var(--r);padding:10px 12px;font-family:'Bodoni Moda',serif;font-size:1rem;font-weight:700;color:var(--forest);flex:1;text-align:center}
.attend-stat .stat-sub{color:var(--faint);font-weight:400;font-size:.6rem;display:block;margin-top:2px;font-family:'Jost',sans-serif;font-style:italic;letter-spacing:.04em;text-transform:uppercase}

/* ── NUTRITION ── */
.nutr-hero{border-radius:var(--r2);padding:18px 20px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.nutr-hero::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);opacity:.5;border-radius:2px;pointer-events:none}
.nutr-hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;position:relative;z-index:1}
.nutr-cals{font-family:'Bodoni Moda',serif;font-size:3.2rem;font-weight:600;color:var(--forest);line-height:.85}
.nutr-label{font-family:'Bodoni Moda',serif;font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
.nutr-goal-txt{font-family:'Jost',sans-serif;font-style:italic;font-size:.86rem;font-weight:500}
.nutr-bar{height:2px;background:var(--sand2);margin:10px 0 3px;position:relative;overflow:visible}
.nutr-bar-fill{height:100%;background:var(--gold);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.nutr-bar-fill::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:var(--gold);border-radius:50%}
.nutr-bar-fill.over{background:var(--burgundy)}
.prot-bar-fill{background:var(--forest)}
.prot-bar-fill::after{background:var(--forest)}
.nutr-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
.macro-chip{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center}
.macro-val{font-family:'Bodoni Moda',serif;font-size:1.1rem;font-weight:700;color:var(--forest)}
.macro-val.green{color:var(--forest)}
.macro-lbl{font-family:'Bodoni Moda',serif;font-size:.58rem;color:var(--faint);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.meal-section{margin-bottom:14px}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.meal-name{font-family:'Bodoni Moda',serif;font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.meal-cals{font-family:'Bodoni Moda',serif;font-size:.78rem;font-weight:600;color:var(--forest)}
.food-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);margin-bottom:4px}
.food-row:hover .del-btn{opacity:1}
.food-name{flex:1;font-size:.94rem;font-weight:400;color:var(--ink)}
.food-cal-badge{font-family:'Bodoni Moda',serif;font-size:.72rem;font-weight:600;color:var(--forest);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:1px 7px;flex-shrink:0}
.food-add-row input[type=text]{flex:1;min-width:80px}
.food-add-row input[type=number]{width:60px}
.weight-row{display:flex;gap:8px;align-items:center;border-radius:var(--r);padding:11px 15px;margin-bottom:7px}
.weight-row label{flex:1;font-size:.9rem;font-style:italic;color:var(--muted)}
.weight-row input{width:78px;background:var(--paper);border:1px solid var(--line2);color:var(--forest);font-family:'Bodoni Moda',serif;font-weight:600}
.weight-log-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:var(--r);margin-bottom:4px}
.weight-log-date{font-family:'Jost',sans-serif;font-style:italic;font-size:.72rem;color:var(--faint)}
.weight-log-val{font-family:'Bodoni Moda',serif;font-size:1.1rem;font-weight:600;color:var(--forest)}
.weight-log-diff{font-family:'Bodoni Moda',serif;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:2px}
.weight-log-diff.up{background:transparent;border:1px solid var(--forest);color:var(--forest)}
.weight-log-diff.down{background:transparent;border:1px solid var(--burgundy);color:var(--burgundy)}

/* ── WISHLIST ── */
.wish-cat-pill{font-family:'Bodoni Moda',serif}
.wish-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.wish-card{border-radius:var(--r2);overflow:hidden;position:relative;transition:all .18s}
.wish-card:hover{border-color:var(--gold)}
.wish-card:hover .wish-del{opacity:1}
.wish-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--paper);display:block}
.wish-img-empty{width:100%;aspect-ratio:1;background:var(--paper2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-family:'Jost',sans-serif;font-style:italic;font-size:.72rem;letter-spacing:.06em}
.wish-info{padding:11px 13px}
.wish-name{font-size:.94rem;font-weight:500;color:var(--ink);margin-bottom:3px;line-height:1.3}
.wish-price{font-family:'Bodoni Moda',serif;font-size:.92rem;font-weight:700;color:var(--forest)}
.wish-link{display:inline-block;margin-top:6px;font-family:'Bodoni Moda',serif;font-size:.7rem;color:var(--muted);text-decoration:none;border:1px solid var(--line2);border-radius:2px;padding:2px 9px;transition:all .15s;letter-spacing:.06em;text-transform:uppercase}
.wish-link:hover{border-color:var(--gold);color:var(--forest)}
.wish-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:2px;border:none;background:rgba(243,239,228,0.85);color:var(--muted);font-size:15px;cursor:pointer;opacity:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.wish-del:hover{color:var(--burgundy)}
.wish-add-card{background:transparent;border:1px dashed var(--line2);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:150px;color:var(--faint);transition:all .18s}
.wish-add-card:hover{border-color:var(--gold);color:var(--forest)}
.wish-add-plus{font-family:'Bodoni Moda',serif;font-size:2.2rem;font-weight:400;line-height:1}
.wish-add-lbl{font-family:'Bodoni Moda',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.wish-form{border-radius:var(--r2);padding:16px;margin-bottom:14px}
.wish-form input{width:100%;margin-bottom:8px}
.wish-img-preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);margin-bottom:8px;border:1px solid var(--line)}
.wish-upload-btn{width:100%;padding:10px;border-radius:var(--r);border:1px dashed var(--line2);background:var(--paper);color:var(--muted);font-family:'Bodoni Moda',serif;font-size:.78rem;font-weight:600;cursor:pointer;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase}
.wish-upload-btn:hover{border-color:var(--gold);color:var(--forest)}
.wish-form-btns{display:flex;gap:8px;margin-top:4px}
.wish-save-btn{flex:1;padding:11px;border-radius:var(--r);border:1px solid var(--forest);background:var(--forest);color:var(--paper);font-family:'Bodoni Moda',serif;font-size:.8rem;font-weight:600;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.wish-save-btn:hover{background:var(--forest2)}
.wish-cancel-btn{padding:11px 16px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;color:var(--muted);font-family:'Bodoni Moda',serif;font-size:.8rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.add-cat-btn{font-family:'Bodoni Moda',serif;font-size:.78rem;font-weight:600;padding:4px 13px;border-radius:2px;border:1px dashed var(--line2);background:transparent;color:var(--faint);cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
.add-cat-btn:hover{border-color:var(--gold);color:var(--forest)}

/* ── MONEY ── */
.money-hero{border-radius:var(--r2);padding:18px 20px;margin-bottom:8px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.money-hero::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);opacity:.5;border-radius:2px;pointer-events:none}
.money-goal-name{font-family:'Bodoni Moda',serif;font-size:1.3rem;font-weight:600;color:var(--forest);margin-bottom:3px;letter-spacing:.02em;position:relative;z-index:1}
.money-goal-nums{font-family:'Jost',sans-serif;font-size:.9rem;color:var(--muted);margin-bottom:12px;position:relative;z-index:1}
.money-goal-nums b{color:var(--forest);font-weight:600}
.money-bar{height:6px;background:var(--sand2);overflow:hidden;margin-bottom:6px;position:relative;z-index:1;border:none}
.money-bar-fill{height:100%;background:var(--gold);transition:width .7s cubic-bezier(.4,0,.2,1)}
.money-pct{font-family:'Jost',sans-serif;font-style:italic;font-size:.74rem;color:var(--faint);text-align:right;position:relative;z-index:1}
.money-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.money-stat{border-radius:var(--r);padding:15px 16px}
.money-stat-val{font-family:'Bodoni Moda',serif;font-size:1.7rem;font-weight:700;line-height:1}
.money-stat-val.green{color:var(--forest)}
.money-stat-val.cyan{color:var(--gold)}
.money-stat-val.gold{color:var(--gold)}
.money-stat-lbl{font-family:'Bodoni Moda',serif;font-size:.6rem;color:var(--faint);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.money-entry{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:var(--r);margin-bottom:4px}
.money-entry:hover .del-btn{opacity:1}
.money-entry-name{flex:1;font-size:.94rem;font-weight:400;color:var(--ink)}
.money-entry-date{font-family:'Jost',sans-serif;font-style:italic;font-size:.7rem;color:var(--faint);margin-top:1px}
.money-entry-amt{font-family:'Bodoni Moda',serif;font-size:.98rem;font-weight:700;flex-shrink:0}
.money-entry-amt.in{color:var(--forest)}
.money-entry-amt.out{color:var(--burgundy)}
.money-form input[type=text]{flex:1;min-width:100px}
.money-form input[type=number]{width:90px}
.goal-set-form{border-radius:var(--r2);padding:16px;margin-bottom:8px}
.goal-set-form input{width:100%;margin-bottom:8px}
.move-btns{display:flex;gap:6px;margin-top:8px}
.move-btn{flex:1;padding:9px;border-radius:2px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-family:'Bodoni Moda',serif;font-size:.76rem;font-weight:600;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.move-btn:hover{border-color:var(--forest);color:var(--forest)}
.money-section-card{border-radius:var(--r2);padding:16px;margin-bottom:8px}

/* ── FOOD MODAL ── */
.food-modal{position:fixed;inset:0;z-index:1000;background:rgba(34,48,42,0.4);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.food-modal-inner{background:var(--paper);border:1px solid var(--line2);border-top:2px solid var(--gold);border-radius:8px 8px 0 0;width:100%;max-width:460px;max-height:85vh;display:flex;flex-direction:column;padding:22px 18px 28px;box-shadow:0 -20px 60px rgba(34,48,42,0.2)}
.food-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.food-modal-title{font-family:'Bodoni Moda',serif;font-size:1.3rem;font-weight:600;color:var(--forest);letter-spacing:.04em;text-transform:uppercase}
.food-modal-close{background:none;border:none;color:var(--faint);font-size:24px;cursor:pointer;line-height:1}
.food-search{width:100%;margin-bottom:8px;background:var(--sand)}
.food-cat-label{font-family:'Bodoni Moda',serif;font-size:.62rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.16em;margin:12px 0 6px}
.food-list{overflow-y:auto;flex:1}
.food-pick{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sand);border:1px solid var(--line);border-radius:var(--r);margin-bottom:4px;cursor:pointer;transition:all .15s}
.food-pick:hover,.food-pick:active{border-color:var(--gold);background:var(--gold-g)}
.food-pick-info{flex:1}
.food-pick-name{font-size:.94rem;font-weight:400;color:var(--ink)}
.food-pick-unit{font-family:'Jost',sans-serif;font-style:italic;font-size:.68rem;color:var(--faint);margin-top:1px}
.food-pick-macros{text-align:right;flex-shrink:0}
.food-pick-cal{font-family:'Bodoni Moda',serif;font-size:.86rem;color:var(--forest);font-weight:600}
.food-pick-prot{font-family:'Jost',sans-serif;font-style:italic;font-size:.66rem;color:var(--muted);margin-top:1px}
.qty-row{display:flex;align-items:center;gap:14px;margin:18px 0}
.qty-row label{flex:1;font-size:.94rem;color:var(--muted);font-style:italic}
.qty-input{width:90px;text-align:center;font-family:'Bodoni Moda',serif;font-size:1.3rem;font-weight:600;background:var(--sand);border:1px solid var(--line2);color:var(--forest)}
.qty-preview{background:var(--sand);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;margin:16px 0}
.qty-preview-cal{font-family:'Bodoni Moda',serif;font-size:2.2rem;font-weight:700;color:var(--forest)}
.qty-preview-sub{font-family:'Jost',sans-serif;font-style:italic;font-size:.8rem;color:var(--muted);margin-top:4px}
.qty-add-btn{width:100%;padding:14px;border-radius:var(--r);border:1px solid var(--forest);background:var(--forest);color:var(--paper);font-family:'Bodoni Moda',serif;font-size:.86rem;font-weight:600;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.qty-add-btn:hover{background:var(--forest2)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--paper2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}

/* ── EXERCISE ANIMATIONS ── */
.demo-btn{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .18s;padding:0}
.demo-btn:hover{border-color:var(--gold);background:var(--gold-g)}
.anim-svg{display:block;width:100%;height:100%}
.anim-fig{stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.anim-fig .joint{fill:var(--gold);stroke:none}
.anim-mat{stroke:var(--line2);stroke-width:3}
/* inline mini demo inside a routine row */
.mini-demo{width:100%;height:120px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);margin-top:8px;overflow:hidden}
/* follow-along modal */
.fa-modal{position:fixed;inset:0;z-index:1200;background:var(--paper);display:flex;flex-direction:column;padding:22px 18px calc(28px + env(safe-area-inset-bottom));animation:fadeIn .2s}
.fa-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

function today() {
 const d=new Date();
 return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function p2(n){return String(n).padStart(2,"0")}

// ─── SAFE STORAGE ────────────────────────────────────────────────────────────
// Photos live in IndexedDB (big capacity). This JSON stays small (~25KB) and is
// mirrored to a backup key, so a bad write can NEVER wipe your data again.
const KEY_BAK = KEY + "_bak";

function load() {
 const tryParse=(k)=>{
  try { const r=localStorage.getItem(k); if(r) return JSON.parse(r); } catch(e){ console.error("Prodo: could not read",k,e); }
  return null;
 };
 // main → backup → (last resort) defaults
 let d=tryParse(KEY);
 if(!d){
  d=tryParse(KEY_BAK);
  if(d) console.warn("Prodo: main save was unreadable — restored from backup.");
 }
 if(d) return d;
 // Nothing readable. Keep any raw string aside instead of destroying it.
 try{
  const raw=localStorage.getItem(KEY);
  if(raw) localStorage.setItem(KEY+"_corrupt", raw);
 }catch(e){}
 return defaultData();
}

let quotaWarned=false;
function warnStorageFull(){
 if(quotaWarned) return;
 quotaWarned=true;
 alert("⚠️ Storage is full — your last change could NOT be saved.\n\nDelete a few progress photos or wishlist images to free space, then try again. Nothing already saved was lost.");
}

// ─── LOCAL SAVE (no cloud — data lives safely in this device's browser) ───────
let appReady=false; // set true after migrations, so autoLog never runs half-set-up
function save() {
 // auto-log today's progress on every change — replaces the old "Log" buttons
 if(appReady){ try { autoLogDay(today()); } catch(e){} }
 let data;
 try { data=JSON.stringify(S); } catch(e){ console.error("Prodo: serialize failed",e); return; }
 try {
  localStorage.setItem(KEY,data);
  // mirror to backup only after the main write succeeded
  try { localStorage.setItem(KEY_BAK,data); } catch(e){}
 } catch(e) {
  console.error("Prodo: SAVE FAILED",e);
  // free room by dropping the backup, then retry once
  try { localStorage.removeItem(KEY_BAK); localStorage.setItem(KEY,data); return; } catch(e2){}
  warnStorageFull();
 }
}

// Drop raw day-by-day logs older than 180 days (the small history summaries stay).
function pruneOldLogs(){
 const c=new Date(); c.setDate(c.getDate()-180);
 const cut=c.getFullYear()+"-"+p2(c.getMonth()+1)+"-"+p2(c.getDate());
 const prune=(obj)=>{ if(obj&&typeof obj==="object") Object.keys(obj).forEach(k=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<cut) delete obj[k]; }); };
 prune(S.completions); prune(S.dayOverrides);
 if(S.gym) prune(S.gym.gymLog);
 if(S.nightly) prune(S.nightly.log);
 if(S.morning) prune(S.morning.log);
 if(S.nutrition) prune(S.nutrition.log);
}

// ─── IMAGE STORAGE (IndexedDB — keeps big photos OUT of the 5MB localStorage) ─
const IDB_NAME="prodo_media", IDB_STORE="images";
let idb=null, idbOK=false;
let IMG={}; // in-memory cache: key -> dataURL

function idbOpen(){
 return new Promise(res=>{
  try{
   if(!window.indexedDB) return res(false);
   const req=indexedDB.open(IDB_NAME,1);
   req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
   req.onsuccess=()=>{ idb=req.result; idbOK=true; res(true); };
   req.onerror=()=>res(false);
  }catch(e){ res(false); }
 });
}
function idbPut(k,v){
 return new Promise(res=>{
  if(!idbOK) return res(false);
  try{ const tx=idb.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }
  catch(e){ res(false); }
 });
}
function idbDel(k){
 return new Promise(res=>{
  if(!idbOK) return res(false);
  try{ const tx=idb.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }
  catch(e){ res(false); }
 });
}
function idbLoadAll(){
 return new Promise(res=>{
  if(!idbOK) return res({});
  try{
   const out={}, tx=idb.transaction(IDB_STORE,"readonly");
   const req=tx.objectStore(IDB_STORE).openCursor();
   req.onsuccess=e=>{ const c=e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
   req.onerror=()=>res({});
  }catch(e){ res({}); }
 });
}
// A stored value is either a dataURL (legacy, inline) or an IndexedDB key.
function resolveImg(v){
 if(!v) return "";
 return v.indexOf("data:")===0 ? v : (IMG[v]||"");
}
// Save an image and return what to store in S (a key, or the dataURL as fallback)
async function putImg(key,dataUrl){
 IMG[key]=dataUrl;
 const ok=await idbPut(key,dataUrl);
 return ok?key:dataUrl; // if IndexedDB is unavailable, fall back to inline
}
async function delImg(v){
 if(!v||v.indexOf("data:")===0) return;
 delete IMG[v];
 await idbDel(v);
}
// One-time: move any inline base64 photos out of localStorage into IndexedDB.
async function migrateInlineImages(){
 if(!idbOK) return;
 let moved=0;
 for(const it of (S.wishlist&&S.wishlist.items)||[]){
  if(it.img && it.img.indexOf("data:")===0){
   const k="w_"+it.id;
   if(await idbPut(k,it.img)){ IMG[k]=it.img; it.img=k; moved++; }
  }
 }
 const movePhotos=async(arr,prefix,slots)=>{
  for(const e of arr||[]){
   for(const s of slots){
    if(e[s] && e[s].indexOf("data:")===0){
     const k=prefix+"_"+e.month+"_"+s;
     if(await idbPut(k,e[s])){ IMG[k]=e[s]; e[s]=k; moved++; }
    }
   }
  }
 };
 await movePhotos(S.physique,"ph",["front","back","side"]);
 await movePhotos(S.facePhotos,"fa",["front","side"]);
 if(moved){ console.log("Prodo: moved "+moved+" photos to IndexedDB — localStorage freed."); save(); }
}

// Export all data as a text string (for manual backups)
function exportData(){
 return JSON.stringify(S);
}
// Import data from a backup string
function importData(str){
 try{
  const data=JSON.parse(str);
  if(data && typeof data==="object"){
   S=data;
   save();
   return true;
  }
 }catch(e){}
 return false;
}

// ─── AUTO-LOG ────────────────────────────────────────────────────────────────
// Logs EVERYTHING for a given date automatically — no manual "Log" buttons.
// Runs live for today (on every save) and for yesterday when the day rolls over.
// Only writes when there's real activity, so empty days never create entries.
function autoLogDay(d){
 if(!d || !S || !S.activities) return;
 const dow=new Date(d+"T12:00:00").getDay();

 // ── Schedule → Stats + history ──
 const base=(S.dayOverrides&&S.dayOverrides[d])?S.dayOverrides[d]:(S.activities[dow]||[]);
 const all=base.concat(S.bonus||[]);
 const comp=(S.completions&&S.completions[d])||[];
 const doneItems=all.filter(a=>!a.header&&comp.includes(a.id));
 if(doneItems.length){
  const pts=doneItems.reduce((s,a)=>s+a.pts,0);
  if(!S.dayHistory) S.dayHistory={};
  S.dayHistory[d]={done:doneItems.length,total:all.length};
  if(!S.schedLog) S.schedLog=[];
  const entry={date:d,done:doneItems.length,total:base.length,pts,hit:pts>=S.target};
  const ex=S.schedLog.find(h=>h.date===d);
  if(ex) Object.assign(ex,entry); else S.schedLog.push(entry);
 }

 // ── Morning routine ──
 if(S.morning&&S.morning.stretches){
  const md=(S.morning.log&&S.morning.log[d])||[];
  if(md.length){
   const total=S.morning.stretches.length+S.morning.exercises.length+S.morning.skincare.length;
   if(!S.morning.history) S.morning.history=[];
   const ex=S.morning.history.find(h=>h.date===d);
   if(ex){ex.done=md.length;ex.total=total;} else S.morning.history.push({date:d,done:md.length,total});
  }
 }

 // ── Nightly routine ──
 if(S.nightly&&S.nightly.steps){
  const nd=(S.nightly.log&&S.nightly.log[d])||[];
  if(nd.length){
   const isStrong=(dow===1||dow===3||dow===5);
   const steps=S.nightly.steps.filter(s=>s.dayType==="all"||(s.dayType==="strong"&&isStrong)||(s.dayType==="serum"&&!isStrong)||(s.dayType==="sunday"&&dow===0)||(s.dayType==="clay"&&(dow===4||dow===0)));
   const total=steps.length+S.nightly.massages.length+S.nightly.exercises.length;
   if(!S.nightly.history) S.nightly.history=[];
   const ex=S.nightly.history.find(h=>h.date===d);
   if(ex){ex.done=nd.length;ex.total=total;} else S.nightly.history.push({date:d,done:nd.length,total});
  }
 }

 // ── Nutrition ──
 if(S.nutrition&&S.nutrition.log){
  const nl=S.nutrition.log[d]||{};
  const foods=Object.values(nl).flat();
  if(foods.length){
   const cals=foods.reduce((s,f)=>s+(f.cals||0),0);
   const protein=foods.reduce((s,f)=>s+(f.protein||0),0);
   if(!S.nutrition.history) S.nutrition.history=[];
   const entry={date:d,cals,protein,items:foods.length};
   const ex=S.nutrition.history.find(h=>h.date===d);
   if(ex) Object.assign(ex,entry); else S.nutrition.history.push(entry);
  }
 }

 // ── Gym: attendance + PRs (counts as a session once any set is checked) ──
 if(S.gym&&S.gym.gymLog){
  const gl=S.gym.gymLog[d]||{};
  const anyDone=Object.values(gl).some(sets=>Array.isArray(sets)&&sets.some(s=>s.done));
  if(anyDone){
   if(!S.gym.attendance) S.gym.attendance=[];
   if(!S.gym.attendance.includes(d)) S.gym.attendance.push(d);
   const routine=S.gym.routines[dow];
   if(routine){
    if(!S.gym.prs) S.gym.prs={};
    routine.exercises.forEach(ex=>{
     const sets=gl[ex.id]; if(!sets) return;
     const maxReps=Math.max(...sets.filter(s=>s.done).map(s=>s.reps),0);
     if(maxReps>0){
      const cur=S.gym.prs[ex.id];
      if(!cur||maxReps>=cur.reps) S.gym.prs[ex.id]={name:ex.name,reps:maxReps,date:d};
     }
    });
   }
  }
 }
}

function isConsec(a,b){
 const da=new Date(a+"T12:00:00"), db=new Date(b+"T12:00:00");
 return (db-da)===86400000;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayDow(){return new Date().getDay();}
function toMin(t){if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m;}
function fmtTime(t){
 if(!t)return"";
 const[h,m]=t.split(":").map(Number);
 const ap=h>=12?"PM":"AM";
 const h12=h%12===0?12:h%12;
 return h12+":"+(m===0?"00":p2(m))+" "+ap;
}
function fmtRange(s,e){
 if(!s)return"";
 const sf=fmtTime(s), ef=fmtTime(e);
 const sparts=sf.split(" "), eparts=ef.split(" ");
 if(sparts[1]===eparts[1]) return sparts[0]+"–"+ef;
 return sf+"–"+ef;
}
function sortByTime(arr){return[...arr].sort((a,b)=>(a.start||"99:99").localeCompare(b.start||"99:99"));}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function isNow(a){
 if(!a.start||!a.end)return false;
 const nm=nowMin();
 return nm>=toMin(a.start)&&nm<toMin(a.end);
}
function todayPts(){
 const t=today(), dow=todayDow();
 const base=(S.dayOverrides&&S.dayOverrides[t])?S.dayOverrides[t]:(S.activities[dow]||[]);
 const acts=base.concat(S.bonus||[]);
 const comp=S.completions[t]||[];
 return acts.filter(a=>!a.header&&comp.includes(a.id)).reduce((s,a)=>s+(a.pts||0),0);
}

function bubblesLayer(){
 const b=[];
 const specs=[
  [8,42,22,-6],[22,68,15,-2],[40,20,30,-9],[58,80,18,-4],
  [72,35,24,-7],[85,60,14,-1],[15,88,20,-5],[92,15,16,-3],
  [33,52,12,0],[66,10,26,-8]
 ];
 specs.forEach(([left,top,size,delay],i)=>{
  const dur=14+(i%5)*3;
  b.push(`<span class="bubble" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`);
 });
 return `<div class="bubbles">${b.join("")}</div>`;
}

// live clock (updates every second) — used on cover + header
let hudClockTimer=null;
function startHudClock(){
 const tick=()=>{
  const els=[document.getElementById("hud-clock"),document.getElementById("cover-clock")].filter(Boolean);
  if(!els.length){ if(hudClockTimer){clearInterval(hudClockTimer);hudClockTimer=null;} return; }
  const n=new Date();
  const hhmmss=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
  const hhmm=hhmmss.slice(0,5);
  els.forEach(el=>el.textContent=el.id==="cover-clock"?hhmm:hhmmss);
 };
 tick();
 if(hudClockTimer) clearInterval(hudClockTimer);
 hudClockTimer=setInterval(tick,1000);
}

const GYM_DAYS=[1,2,3,4,5,6,0];
const GYM_DAY_NAMES={1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat",0:"Sun"};

function gymTodayLog(){
 const t=today();
 if(!S.gym.gymLog[t]) S.gym.gymLog[t]={};
 return S.gym.gymLog[t];
}

function gymStreak(){
 const att=[...S.gym.attendance].sort().reverse();
 if(!att.length) return 0;
 let streak=0, cur=new Date();
 for(let i=0;i<60;i++){
 const k=cur.getFullYear()+"-"+p2(cur.getMonth()+1)+"-"+p2(cur.getDate());
 if(att.includes(k)) streak++;
 else if(i>0) break;
 cur.setDate(cur.getDate()-1);
 }
 return streak;
}

function renderAttendanceCalendar(){
 const now=new Date(), t=today();
 const att=S.gym.attendance||[];
 const days=[];
 for(let i=27;i>=0;i--){
 const d=new Date(now); d.setDate(now.getDate()-i);
 const k=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
 const isFuture=k>t, isT=k===t, went=att.includes(k);
 days.push({k,label:d.getDate(),isFuture,isT,went});
 }
 const total=att.filter(k=>{
 const d=new Date(k+"T12:00:00"), n=new Date();
 return (n-d)<30*86400000;
 }).length;
 const streak=gymStreak();
 const longest=longestGymStreak();
 return`
 <div class="stitle">Gym attendance — last 28 days</div>
 <div class="attend-grid">
 ${days.map(d=>`<div class="attend-cell ${d.isFuture?"future":d.went?"went":"missed"}${d.isT?" is-today":""}">${d.label}</div>`).join("")}
 </div>
 <div class="attend-stats">
 <div class="attend-stat"> ${streak}<span class="stat-sub">current streak</span></div>
 <div class="attend-stat"> ${longest}<span class="stat-sub">longest streak</span></div>
 <div class="attend-stat"> ${total}<span class="stat-sub">days this month</span></div>
 </div>
 `;
}

function longestGymStreak(){
 const att=[...new Set(S.gym.attendance||[])].sort();
 if(!att.length) return 0;
 let best=1,cur=1;
 for(let i=1;i<att.length;i++){
 const prev=new Date(att[i-1]+"T12:00:00"), next=new Date(att[i]+"T12:00:00");
 if((next-prev)===86400000) cur++;
 else cur=1;
 if(cur>best) best=cur;
 }
 return best;
}

function attachGymHandlers(){
 document.querySelectorAll("[data-gview]").forEach(el=>el.onclick=()=>{gymView=el.dataset.gview;renderContent();});
 document.querySelectorAll("[data-gday]").forEach(el=>el.onclick=()=>{gymDay=+el.dataset.gday;renderContent();});
 document.querySelectorAll("[data-set-ex]").forEach(el=>el.oninput=()=>{
 const exId=el.dataset.setEx, i=+el.dataset.setI, val=+el.value||1;
 const log=gymTodayLog();
 const routine=S.gym.routines[gymDay];
 const ex=routine?.exercises.find(e=>e.id===exId);
 if(!ex)return;
 if(!log[exId]) log[exId]=ex.sets.map(s=>({...s}));
 log[exId][i].reps=val;
 save();
 });
 document.querySelectorAll("[data-ex-check]").forEach(el=>el.onclick=()=>{
 const exId=el.dataset.exCheck;
 const log=gymTodayLog();
 const routine=S.gym.routines[gymDay];
 const ex=routine?.exercises.find(e=>e.id===exId);
 if(!ex)return;
 if(!log[exId]) log[exId]=ex.sets.map(s=>({...s}));
 const allDone=log[exId].every(s=>s.done);
 log[exId].forEach(s=>s.done=!allDone);
 save(); renderContent();
 });
 document.querySelectorAll("[data-done-ex]").forEach(el=>el.onclick=()=>{
 const exId=el.dataset.doneEx, i=+el.dataset.doneI;
 const log=gymTodayLog();
 const routine=S.gym.routines[gymDay];
 const ex=routine?.exercises.find(e=>e.id===exId);
 if(!ex)return;
 if(!log[exId]) log[exId]=ex.sets.map(s=>({...s}));
 log[exId][i].done=!log[exId][i].done;
 save(); renderContent();
 });
 document.querySelectorAll("[data-del-ex]").forEach(el=>el.onclick=()=>{
 const d=+el.dataset.delExDay;
 if(S.gym.routines[d]) S.gym.routines[d].exercises=S.gym.routines[d].exercises.filter(e=>e.id!==el.dataset.delEx);
 save(); renderContent();
 });
 const addBtn=document.getElementById("ex-add-btn");
 if(addBtn) addBtn.onclick=()=>{
 const name=document.getElementById("ex-name").value.trim();
 const muscle=document.getElementById("ex-muscle").value;
 const sets=+document.getElementById("ex-sets").value||3;
 const reps=+document.getElementById("ex-reps").value||10;
 if(!name)return;
 if(!S.gym.routines[gymDay]) S.gym.routines[gymDay]={name:DAYS[gymDay],exercises:[]};
 const newEx={id:"g"+Date.now(),name,muscle,sets:Array.from({length:sets},()=>({reps,done:false}))};
 S.gym.routines[gymDay].exercises.push(newEx);
 save(); renderContent();
 };
}

 return`
 <div class="nutr-tab-btns">

 <button class="nutr-tab-btn active" data-nview="weight">Weight Log</button>
 </div>
 <div class="nutr-hero" style="margin-bottom:16px">
 <div class="nutr-hero-top" style="margin-bottom:0">
 <div>
 <div class="nutr-cals">${logs.length?logs[0].kg:"--"}<span style="font-size:1.2rem"> kg</span></div>
 <div class="nutr-label">${logs.length?"latest weigh-in":"no weigh-ins yet"}</div>
 </div>
 <div style="text-align:right">
 ${logs.length>=2?`<div class="nutr-goal-txt" style="color:${logs[0].kg>=logs[1].kg?"var(--green)":"var(--burgundy)"}">${logs[0].kg>logs[1].kg?"+":logs[0].kg===logs[1].kg?"":""}${Math.abs(logs[0].kg-logs[1].kg).toFixed(1)} kg</div><div style="font-size:.72rem;color:var(--faint);font-weight:600;margin-top:4px">since last weigh-in</div>`:""}
 </div>
 </div>

 ${logs.length===0?`<div class="empty-msg">No weigh-ins yet — log your first one above! </div>`:""}

 return`<div class="weight-log-item">

function attachNutritionHandlers(){
 document.querySelectorAll("[data-nview]").forEach(el=>el.onclick=()=>{nutrView=el.dataset.nview;renderContent();});
 // plan: check/uncheck today's meals
 document.querySelectorAll("[data-plan-meal]").forEach(el=>el.onclick=()=>{
  const t=today();
  const i=+el.dataset.planMeal;
  if(!S.nutrition.planLog) S.nutrition.planLog={};
  if(!S.nutrition.planLog[t]) S.nutrition.planLog[t]=[];
  const arr=S.nutrition.planLog[t];
  const idx=arr.indexOf(i);
  if(idx>=0) arr.splice(idx,1); else arr.push(i);
  save(); renderContent();
 });
 const goalIn=document.getElementById("cal-goal-in");
 if(goalIn) goalIn.onchange=e=>{const v=+e.target.value;if(v>=500){S.nutrition.calGoal=v;save();renderContent();}};
 const protGoalIn=document.getElementById("prot-goal-in");
 if(protGoalIn) protGoalIn.onchange=e=>{const v=+e.target.value;if(v>=20){S.nutrition.proteinGoal=v;save();renderContent();}};
 const bwIn=document.getElementById("bw-in");
 if(bwIn) bwIn.onchange=e=>{const v=+e.target.value;if(v>=30){S.nutrition.bodyweightKg=v;S.nutrition.proteinGoal=Math.round(v*2);save();renderContent();}};
 document.querySelectorAll("[data-add-meal]").forEach(btn=>{
 btn.onclick=()=>{
 const meal=btn.dataset.addMeal;
 const nameIn=document.querySelector(`.food-name-in[data-meal="${meal}"]`);
 const calIn=document.querySelector(`.food-cal-in[data-meal="${meal}"]`);
 const protIn=document.querySelector(`.food-prot-in[data-meal="${meal}"]`);
 const name=nameIn?.value.trim(); if(!name)return;
 const cals=+calIn?.value||0;
 const protein=+protIn?.value||0;
 const log=nutrLog(); if(!log[meal]) log[meal]=[];
 log[meal].push({id:"f"+Date.now(),name,cals,protein});
 save(); renderContent();
 };
 });
 document.querySelectorAll("[data-browse-meal]").forEach(btn=>{
 btn.onclick=()=>openFoodLibrary(btn.dataset.browseMeal);
 });
 document.querySelectorAll("[data-del-food]").forEach(el=>el.onclick=()=>{
 const meal=el.dataset.delMeal, id=el.dataset.delFood;
 const log=nutrLog(); if(log[meal]) log[meal]=log[meal].filter(f=>f.id!==id);
 save(); renderContent();
 });
 const wBtn=document.getElementById("weight-add-btn");
 if(wBtn) wBtn.onclick=()=>{
 const val=+document.getElementById("weight-in").value;
 if(!val||val<30)return;
 S.nutrition.weightLog=S.nutrition.weightLog.filter(w=>w.date!==today());
 S.nutrition.weightLog.push({date:today(),kg:val});
 save(); renderContent();
 };
}

let foodModalMeal=null;
let foodSearchTerm="";

function openFoodLibrary(meal){
  foodModalMeal=meal;
  foodSearchTerm="";
  renderFoodModal();
}
function closeFoodModal(){
  foodModalMeal=null;
  document.getElementById("food-modal-root").innerHTML="";
}
function foodListHTML(){
  const term=foodSearchTerm.toLowerCase();
  const matches=FOOD_DB.filter(f=>f.name.toLowerCase().includes(term));
  const cats=[...new Set(matches.map(f=>f.cat))];
  return `${matches.length===0?`<div class="empty-state">No foods found. Try a different search, or add it manually.</div>`:""}
    ${cats.map(cat=>`
      <div class="food-cat-label">${cat}</div>
      ${matches.filter(f=>f.cat===cat).map(f=>{
        const idx=FOOD_DB.indexOf(f);
        return`<div class="food-pick" data-food-idx="${idx}">
          <div class="food-pick-info">
            <div class="food-pick-name">${esc(f.name)}</div>
            <div class="food-pick-unit">per ${f.unit}</div>
          </div>
          <div class="food-pick-macros">
            <div class="food-pick-cal">${f.cals} kcal</div>
            <div class="food-pick-prot">${f.protein}g protein</div>
          </div>
        </div>`;
      }).join("")}
    `).join("")}`;
}
function bindFoodPicks(){
  document.querySelectorAll("[data-food-idx]").forEach(el=>{
    el.onclick=()=>openQtyPicker(+el.dataset.foodIdx);
  });
}
function renderFoodModal(){
  const root=document.getElementById("food-modal-root");
  root.innerHTML=`
    <div class="food-modal" id="food-modal-bg">
      <div class="food-modal-inner">
        <div class="food-modal-head">
          <div class="food-modal-title">Food Library</div>
          <button class="food-modal-close" id="fm-close">×</button>
        </div>
        <input type="text" class="food-search" id="fm-search" placeholder="Search foods..." value="${esc(foodSearchTerm)}" autocomplete="off"/>
        <div class="food-list" id="fm-list">${foodListHTML()}</div>
      </div>
    </div>`;
  document.getElementById("fm-close").onclick=closeFoodModal;
  document.getElementById("food-modal-bg").onclick=e=>{if(e.target.id==="food-modal-bg")closeFoodModal();};
  const search=document.getElementById("fm-search");
  search.oninput=e=>{
    foodSearchTerm=e.target.value;
    document.getElementById("fm-list").innerHTML=foodListHTML();
    bindFoodPicks();
  };
  bindFoodPicks();
}
function openQtyPicker(idx){
  const food=FOOD_DB[idx];
  let qty=1;
  const root=document.getElementById("food-modal-root");
  function draw(){
    const cals=Math.round(food.cals*qty);
    const prot=Math.round(food.protein*qty);
    root.innerHTML=`
      <div class="food-modal" id="qty-modal-bg">
        <div class="food-modal-inner">
          <div class="food-modal-head">
            <div class="food-modal-title">${esc(food.name)}</div>
            <button class="food-modal-close" id="qty-close">×</button>
          </div>
          <div class="qty-row">
            <label>Quantity (× ${food.unit})</label>
            <input type="number" class="qty-input" id="qty-input" value="${qty}" min="0.25" step="0.25"/>
          </div>
          <div class="qty-preview">
            <div class="qty-preview-cal">${cals} kcal</div>
            <div class="qty-preview-sub">${prot}g protein · ${qty} × ${food.unit}</div>
          </div>
          <button class="qty-add-btn" id="qty-add">Add to ${foodModalMeal}</button>
        </div>
      </div>`;
    document.getElementById("qty-close").onclick=closeFoodModal;
    document.getElementById("qty-modal-bg").onclick=e=>{if(e.target.id==="qty-modal-bg")closeFoodModal();};
    document.getElementById("qty-input").oninput=e=>{qty=+e.target.value||0;draw();};
    document.getElementById("qty-add").onclick=()=>{
      const log=nutrLog(); if(!log[foodModalMeal]) log[foodModalMeal]=[];
      const label=qty===1?food.name:`${food.name} (${qty}×)`;
      log[foodModalMeal].push({id:"f"+Date.now(),name:label,cals:Math.round(food.cals*qty),protein:Math.round(food.protein*qty)});
      save();
      closeFoodModal();
      renderContent();
    };
  }
  draw();
}

// ─── NIGHTLY ROUTINE (inside Schedule) ───────────────────────────────────────
function renderNightly(){
  const t=today(), dow=todayDow();
  const done=S.nightly.log[t]||[];
  const isStrongDay=(dow===1||dow===3||dow===5);
  const steps=S.nightly.steps.filter(s=>{
    if(s.dayType==="all") return true;
    if(s.dayType==="strong") return isStrongDay;
    if(s.dayType==="serum") return !isStrongDay;
    if(s.dayType==="sunday") return dow===0;
    if(s.dayType==="clay") return dow===4||dow===0;
    return true;
  });
  const exs=S.nightly.exercises;
  const allItems=[...steps,...exs];
  const totalItems=allItems.length;
  const doneCount=allItems.filter(x=>done.includes(x.id)).length;
  const pct=totalItems?Math.round(doneCount/totalItems*100):0;

  const stepRow=(item,idx)=>`
    <div class="t-row">
      <button class="t-check${done.includes(item.id)?" done":""}" data-night="${item.id}">${done.includes(item.id)?"✓":""}</button>
      <div style="flex:1">
        <div class="t-name${done.includes(item.id)?" done":""}">${idx!=null?`<span style="color:var(--gold);font-family:'Bodoni Moda',serif;font-weight:600;margin-right:6px">${idx}</span>`:""}${esc(item.name)}</div>
        <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.76rem;color:var(--muted);margin-top:2px;line-height:1.4">${esc(item.note)}</div>
      </div>
    </div>`;

  return`
    <div class="hero" style="display:block">
      <div class="hero-label" style="margin-top:0">Tonight's Glow-Up</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px">
        <div class="hero-pts" style="font-size:2.6rem">${doneCount}<span style="font-size:1.2rem;color:var(--muted)">/${totalItems}</span></div>
        <div class="goal-label">${pct===100?"All done — glowing":`${pct}% complete`}</div>
      </div>
      <div class="bar-wrap"><div class="bar-fill green" style="width:${pct}%"></div></div>
      <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.8rem;color:var(--muted)">Same routine every night · Cleanse → Mask → Creams</div>
    </div>

    <div class="stitle">Skincare — in order</div>
    ${steps.map((s,i)=>stepRow(s,i+1)).join("")}

    <div class="stitle">Face &amp; Jaw Exercises</div>
    ${exs.map(e=>stepRow(e,null)).join("")}

    <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.76rem;color:${doneCount?"var(--green)":"var(--faint)"};text-align:center;margin-top:14px">${doneCount?"Saving automatically ✓":"Saves automatically as you check ✓"}</div>

    ${(S.nightly.history||[]).length?`
      <div class="stitle">History</div>
      ${S.nightly.history.slice().reverse().slice(0,7).map(h=>`
        <div class="money-entry">
          <div class="money-entry-name" style="flex:1">${h.date}</div>
          <div class="money-entry-amt in">${h.done}/${h.total} done</div>
        </div>`).join("")}
    `:""}

    <div class="empty-state" style="margin-top:14px;text-align:left;font-style:normal">
      <b style="font-family:'Bodoni Moda',serif;letter-spacing:.05em">A note on results:</b><br>
      Face massage de-puffs and boosts circulation for a real but temporary glow — a refresh, not a facelift. Exercises tone muscle over 8-20 weeks of daily practice but won't reshape bone or spot-reduce fat. Always glide massages with oil or moisturizer so you don't tug the skin. Consistency plus good sleep, hydration, and staying lean is what actually moves the needle.
    </div>
  `;
}

function attachNightlyHandlers(){
  const t=today();
  if(!S.nightly.log[t]) S.nightly.log[t]=[];

// compress an image file to a data URL (max dimension px)
function compressImage(file,maxDim,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      let{width,height}=img;
      if(width>height&&width>maxDim){height*=maxDim/width;width=maxDim;}
      else if(height>maxDim){width*=maxDim/height;height=maxDim;}
      const canvas=document.createElement("canvas");
      canvas.width=width;canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      cb(canvas.toDataURL("image/jpeg",0.75));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function monthKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(mk){
  const[y,m]=mk.split("-");
  const names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[+m-1]+" "+y;
}
function progPhotoPage(kind){

  const sub=kind==="physique"?"Front · Back · Side — one set per month":"Front · Side profile — one set per month";
  const mk=monthKey();

            <input type="file" accept="image/*" style="display:none" data-photo-add="${kind}|${mk}|${slot}"/>
          </label>`}

  };

  return`

      <div class="money-goal-name">${title}</div>
      <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.82rem;color:var(--muted)">${sub}</div>

    <div class="stitle">This month · ${monthLabel(mk)}</div>

          </div>
        </div>`).join("")}
    `:`<div class="empty-state">Add photos each month to watch your progress over time.</div>`}
  `;
}
function attachPhotoHandlers(){
  document.querySelectorAll("[data-photo-add]").forEach(inp=>{
    inp.onchange=e=>{

      const[kind,mk,slot]=inp.dataset.photoAdd.split("|");
      compressImage(file,900,async dataUrl=>{
        const arr=kind==="physique"?S.physique:S.facePhotos;
        let entry=arr.find(x=>x.month===mk);

        entry[slot]=await putImg((kind==="physique"?"ph":"fa")+"_"+mk+"_"+slot,dataUrl);
        save(); renderContent();
      });
    };
  });
  document.querySelectorAll("[data-photo-del]").forEach(btn=>{
    btn.onclick=async()=>{
      const[kind,mk,slot]=btn.dataset.photoDel.split("|");
      const arr=kind==="physique"?S.physique:S.facePhotos;
      const entry=arr.find(x=>x.month===mk);
      if(entry){
        await delImg(entry[slot]);
        delete entry[slot];
        const slots=kind==="physique"?["front","back","side"]:["front","side"];
        if(!slots.some(s=>entry[s])){
          const i=arr.indexOf(entry); arr.splice(i,1);
        }
        save(); renderContent();
      }
    };
  });
}

  document.querySelectorAll("[data-complete-goal]").forEach(el=>el.onclick=()=>{

  });
  const ga=document.getElementById("gig-add-btn");
  if(ga) ga.onclick=()=>{
    const name=document.getElementById("gig-name").value.trim();
    const amount=+document.getElementById("gig-amount").value||0;
    if(!name||amount<=0){alert("Enter gig name and amount");return;}
    m.gigs.push({id:"gig"+Date.now(),name,amount,date:today()});
    save();renderContent();
  };
  document.querySelectorAll("[data-gig-del]").forEach(el=>el.onclick=()=>{
    m.gigs=m.gigs.filter(g=>g.id!==el.dataset.gigDel);save();renderContent();
  });
  const sa=document.getElementById("sav-add-btn");
  if(sa) sa.onclick=()=>{
    const name=document.getElementById("sav-name").value.trim()||"Savings";
    const amount=+document.getElementById("sav-amount").value||0;
    if(amount<=0){alert("Enter an amount");return;}
    m.savings+=amount;
    m.savingsLog.push({id:"sav"+Date.now(),name,amount,date:today(),type:"in"});
    save();renderContent();
  };
  document.querySelectorAll("[data-sav-del]").forEach(el=>el.onclick=()=>{
    const s=m.savingsLog.find(x=>x.id===el.dataset.savDel);
    if(s){m.savings-=(s.type==="out"?-s.amount:s.amount);}
    m.savingsLog=m.savingsLog.filter(x=>x.id!==el.dataset.savDel);
    save();renderContent();
  });
}

function renderTracker(){
 const schedLog=S.schedLog||[];
 const gymAtt=(S.gym&&S.gym.attendance)||[];
 const nutrHist=(S.nutrition&&S.nutrition.history)||[];

 const dayKeys=[];
 for(let i=6;i>=0;i--){
  const d=new Date(); d.setDate(d.getDate()-i);
  dayKeys.push(d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()));
 }
 const dayShort=["Su","Mo","Tu","We","Th","Fr","Sa"];

 const t=today();
 const gymThisWeek=dayKeys.filter(k=>gymAtt.includes(k)).length;
 const mealsLogged7=nutrHist.filter(h=>dayKeys.includes(h.date)).length;
 const daysLogged7=schedLog.filter(h=>dayKeys.includes(h.date)).length;
 const avgCals=(()=>{
  const recent=nutrHist.filter(h=>dayKeys.includes(h.date));
  if(!recent.length)return 0;
  return Math.round(recent.reduce((s,h)=>s+(h.cals||0),0)/recent.length);
 })();
 const avgProt=(()=>{
  const recent=nutrHist.filter(h=>dayKeys.includes(h.date));
  if(!recent.length)return 0;
  return Math.round(recent.reduce((s,h)=>s+(h.protein||0),0)/recent.length);
 })();

 const ptsByDay=dayKeys.map(k=>{const e=schedLog.find(h=>h.date===k);return e?e.pts:0;});
 const maxPts=Math.max(S.target,...ptsByDay,1);
 const calByDay=dayKeys.map(k=>{const e=nutrHist.find(h=>h.date===k);return e?e.cals:0;});
 const maxCal=Math.max(S.nutrition.calGoal,...calByDay,1);

 const bars=(vals,max,color,goal)=>`
  <div style="display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 0;position:relative">
   ${goal?`<div style="position:absolute;left:0;right:0;bottom:${8+Math.round(goal/max*94)}px;height:1px;background:var(--gold);opacity:.5"></div>`:""}

     <div style="font-family:'Jost',sans-serif;font-size:.56rem;color:var(--faint);margin-top:4px">${dayShort[new Date(dayKeys[i]+"T12:00:00").getDay()]}</div>

 return`

   <div class="money-stat"><div class="money-stat-val gold">${S.streak}</div><div class="money-stat-lbl">Day streak</div></div>

   <div class="money-stat"><div class="money-stat-val cyan">${avgCals||"--"}</div><div class="money-stat-lbl">Avg kcal / day</div></div>
   <div class="money-stat"><div class="money-stat-val" style="color:var(--green)">${avgProt||"--"}g</div><div class="money-stat-lbl">Avg protein / day</div></div>
  </div>

  <div class="stitle">Points logged · last 7 days</div>
  <div class="money-section-card">
   ${bars(ptsByDay,maxPts,"var(--gold)",S.target)}
   <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.72rem;color:var(--faint);text-align:center;margin-top:4px">Gold line = your daily goal (${S.target} pts)</div>
  </div>

  <div class="stitle">Calories · last 7 days</div>
  <div class="money-section-card">
   ${bars(calByDay,maxCal,"var(--forest2)",S.nutrition.calGoal)}
   <div style="font-family:'Jost',sans-serif;font-style:italic;font-size:.72rem;color:var(--faint);text-align:center;margin-top:4px">Gold line = your calorie goal (${S.nutrition.calGoal} kcal)</div>
  </div>

  <div class="stitle">This week's log</div>
  ${[
   ["Schedule days logged",daysLogged7+"/7"],
   ["Gym sessions",gymThisWeek],

function togglePomo(){

 else{

 pomoTimer=setInterval(()=>{
 pomoState.secs--;
 if(pomoState.secs<=0){
 if(pomoState.mode==="work"){S.pomo.sessionsToday++;save();}
 pomoState.mode=pomoState.mode==="work"?"break":"work";
 pomoState.secs=(pomoState.mode==="work"?S.pomo.workMin:S.pomo.breakMin)*60;
 showNotif("Prodo ⏰",pomoState.mode==="break"?"Break! ":"Back to focus ");

 },1000);

 renderContent();
}

function requestNotif(){

 else{alert("Notifications blocked. Please enable in browser settings.");}
 });

function scheduleNotifs(){
 notifTimers.forEach(t=>clearTimeout(t)); notifTimers=[];
 if(!S.notifEnabled)return;
 const dow=todayDow(), acts=S.activities[dow]||[];
 const now=new Date(), nowMs=now.getTime();
 acts.forEach(a=>{
 if(!a.start)return;
 const[h,m]=a.start.split(":").map(Number);
 const target=new Date(now); target.setHours(h,m,0,0);
 const diff=target.getTime()-nowMs;
 if(diff>0&&diff<86400000){
 notifTimers.push(setTimeout(()=>showNotif("Prodo ⏰",`${a.text} — +${a.pts}pt`),diff));
 }
 });
}

// ─── ICS EXPORT ──────────────────────────────────────────────────────────────
function downloadICS(){
 const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Prodo//EN","CALSCALE:GREGORIAN"];
 const base=new Date();
 for(let dow=0;dow<=6;dow++){
 const acts=(S.activities[dow]||[]).filter(a=>a.start&&a.end);
 const diff=(dow-base.getDay()+7)%7;
 const ed=new Date(base); ed.setDate(base.getDate()+diff);
 acts.forEach(a=>{
 const[sh,sm]=a.start.split(":").map(Number);
 const[eh,em]=a.end.split(":").map(Number);
 const ds=new Date(ed); ds.setHours(sh,sm,0,0);
 const de=new Date(ed); de.setHours(eh,em,0,0);
 const fmt=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
 lines.push("BEGIN:VEVENT",
 `UID:${a.id}@fwd`,`DTSTART:${fmt(ds)}`,`DTEND:${fmt(de)}`,
 `RRULE:FREQ=WEEKLY;BYDAY=${["SU","MO","TU","WE","TH","FR","SA"][dow]}`,
 `SUMMARY:${a.text} (+${a.pts}pt)`,
 "BEGIN:VALARM","TRIGGER:-PT0M","ACTION:DISPLAY",`DESCRIPTION:${a.text}`,"END:VALARM",
 "END:VEVENT");
 });
 }
 lines.push("END:VCALENDAR");
 const blob=new Blob([lines.join("\r\n")],{type:"text/calendar"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a"); a.href=url; a.download="forward-schedule.ics";
 document.body.appendChild(a); a.click(); document.body.removeChild(a);
 URL.revokeObjectURL(url);
}
